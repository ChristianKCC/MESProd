
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body { background:#f1f3f5; }
  .maq-chip { cursor:pointer; border:1px solid #dee2e6; border-radius:8px; padding:8px 12px; transition:all .15s; user-select:none; background:#fff; }
  .maq-chip:hover { background:#f8f9fa; }
  .maq-chip.selected { background:#cfe2ff; border-color:#9ec5fe; }
  .maq-chip.selected .maq-name { color:#084298; }
  .maq-chip.selected .maq-sub { color:#084298; opacity:.7; }
  .maq-name { font-size:13px; font-weight:500; }
  .maq-sub { font-size:11px; color:#6c757d; }
  .section-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:#6c757d; margin-bottom:10px; }
  .user-badge { display:inline-flex; align-items:center; gap:6px; background:#e7f1ff; color:#084298; border-radius:20px; padding:4px 12px; font-size:12px; font-weight:500; }
</style>

<div class="container py-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <span class="user-badge">
      <i class="bi bi-person-circle"></i>
      Juan Pérez — Producción Planta 1
    </span>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAltaClave">
    <i class="bi bi-plus-lg me-1"></i> Nueva clave
  </button>
</div>

<div class="modal fade" id="modalAltaClave" tabindex="-1" aria-labelledby="modalLabel" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">
          <i class="bi bi-key me-2"></i>Alta de clave
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <p class="section-label">Datos de la clave</p>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="noClave" class="form-label">No. clave <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="noClave" placeholder="Ej: 112233" />
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-6">
            <label for="desc" class="form-label">Descripción <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="desc" placeholder="Ej: Agua grande 1.5L" />
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="factor" class="form-label">Factor</label>
            <input type="number" class="form-control" id="factor" placeholder="1.5" step="0.01" min="0" />
          </div>
          <div class="col-md-4">
            <label for="ustd" class="form-label">Ustd</label>
            <input type="text" class="form-control" id="ustd" placeholder="LT" />
          </div>
          <div class="col-md-4">
            <label for="piezas" class="form-label">Piezas</label>
            <input type="number" class="form-control" id="piezas" placeholder="12" min="0" />
          </div>
        </div>

        <hr class="my-3" />

        <p class="section-label">
          Máquinas disponibles
          <span class="text-danger">*</span>
          <span class="text-muted fw-normal text-lowercase ms-1" style="font-size:11px">— según tu departamento</span>
        </p>

        <div class="row g-2 mb-3" id="maqGrid">
          <div class="col-12 text-center text-muted py-3">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Cargando máquinas...
          </div>
        </div>

        <div class="alert alert-secondary d-flex align-items-center py-2 mb-0" id="summaryAlert" role="status">
          <i class="bi bi-pc-display me-2"></i>
          <span id="summaryTxt" class="small">Selecciona al menos una máquina</span>
        </div>

        <div class="alert alert-danger d-flex align-items-center py-2 mb-0 mt-2 d-none" id="errorAlert" role="alert">
          <i class="bi bi-exclamation-circle me-2"></i>
          <span id="errorTxt" class="small"></span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardar" onclick="guardar()">
          <i class="bi bi-floppy me-1"></i> Guardar
        </button>
      </div>

    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toastExito" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi bi-check-circle"></i>
        <span id="toastTxt"></span>
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  const maquinasMock = [
    { id:1, NoMaquina:'MAQ-01', Ubicacion:'Línea A' },
    { id:2, NoMaquina:'MAQ-02', Ubicacion:'Línea A' },
    { id:3, NoMaquina:'MAQ-03', Ubicacion:'Línea B' },
    { id:4, NoMaquina:'MAQ-04', Ubicacion:'Línea B' },
  ];

  async function cargarMaquinas() {
    const grid = document.getElementById('maqGrid');
    grid.innerHTML = `
      <div class="col-12 text-center text-muted py-3">
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        Cargando máquinas...
      </div>`;

    await new Promise(r => setTimeout(r, 1000));

    try {
      const maquinas = maquinasMock;

      if (maquinas.length === 0) {
        grid.innerHTML = `<div class="col-12">
          <div class="alert alert-warning py-2 mb-0 small">
            <i class="bi bi-exclamation-triangle me-2"></i>
            No hay máquinas asignadas a tu departamento.
          </div></div>`;
        return;
      }

      grid.innerHTML = maquinas.map(m => `
        <div class="col-6 col-md-3">
          <label class="maq-chip d-flex align-items-center gap-2 w-100" id="chip-${m.id}">
            <input type="checkbox" class="form-check-input mt-0 flex-shrink-0"
                   value="${m.id}" onchange="toggleChip(this)" aria-label="${m.NoMaquina}" />
            <div>
              <div class="maq-name">${m.NoMaquina}</div>
              <div class="maq-sub">${m.Ubicacion}</div>
            </div>
          </label>
        </div>
      `).join('');

    } catch (err) {
      grid.innerHTML = `<div class="col-12">
        <div class="alert alert-danger py-2 mb-0 small">
          <i class="bi bi-x-circle me-2"></i>
          Error al cargar las máquinas.
          <button class="btn btn-sm btn-outline-danger ms-2 py-0" onclick="cargarMaquinas()">Reintentar</button>
        </div></div>`;
    }
  }

  function toggleChip(cb) {
    cb.closest('.maq-chip').classList.toggle('selected', cb.checked);
    actualizarSummary();
    ocultarError();
  }

  function actualizarSummary() {
    const sel = [...document.querySelectorAll('#maqGrid input:checked')];
    const alert = document.getElementById('summaryAlert');
    const txt   = document.getElementById('summaryTxt');
    if (sel.length === 0) {
      alert.className = 'alert alert-secondary d-flex align-items-center py-2 mb-0';
      txt.textContent = 'Selecciona al menos una máquina';
    } else {
      alert.className = 'alert alert-primary d-flex align-items-center py-2 mb-0';
      const nombres = sel.map(cb => {
        const label = document.querySelector(`#chip-${cb.value} .maq-name`);
        return label ? label.textContent : cb.value;
      }).join(', ');
      txt.textContent = sel.length === 1
        ? `Asignada a: ${nombres}`
        : `Asignada a ${sel.length} máquinas: ${nombres}`;
    }
  }

  function mostrarError(msg) {
    const el = document.getElementById('errorAlert');
    document.getElementById('errorTxt').textContent = msg;
    el.classList.remove('d-none');
  }

  function ocultarError() {
    document.getElementById('errorAlert').classList.add('d-none');
  }

  async function guardar() {
    const clave = document.getElementById('noClave').value.trim();
    const desc  = document.getElementById('desc').value.trim();
    const sel   = [...document.querySelectorAll('#maqGrid input:checked')];

    ocultarError();
    if (!clave) { mostrarError('El No. clave es obligatorio.'); document.getElementById('noClave').focus(); return; }
    if (!desc)  { mostrarError('La descripción es obligatoria.'); document.getElementById('desc').focus(); return; }
    if (sel.length === 0) { mostrarError('Debes asignar al menos una máquina.'); return; }

    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Guardando...';

    const payload = {
      noClave:     clave,
      descripcion: desc,
      factor:      document.getElementById('factor').value,
      ustd:        document.getElementById('ustd').value,
      piezas:      document.getElementById('piezas').value,
      maquinas:    sel.map(cb => cb.value)
    };

    try {
      await new Promise(r => setTimeout(r, 900));
      // En producción: await axios.post('guardar_clave.php', payload);

      const nombres = sel.map(cb => {
        const label = document.querySelector(`#chip-${cb.value} .maq-name`);
        return label ? label.textContent : cb.value;
      }).join(', ');

      document.getElementById('toastTxt').textContent = `Clave ${clave} guardada — ${nombres}`;
      new bootstrap.Toast(document.getElementById('toastExito'), { delay:4000 }).show();

      limpiarFormulario();
      bootstrap.Modal.getInstance(document.getElementById('modalAltaClave')).hide();

    } catch (err) {
      const msg = err.response?.data?.mensaje || 'Error al guardar. Intenta de nuevo.';
      mostrarError(msg);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-floppy me-1"></i> Guardar';
    }
  }

  function limpiarFormulario() {
    ['noClave','desc','factor','ustd','piezas'].forEach(id => document.getElementById(id).value = '');
    document.querySelectorAll('#maqGrid input').forEach(cb => {
      cb.checked = false;
      cb.closest('.maq-chip').classList.remove('selected');
    });
    actualizarSummary();
    ocultarError();
  }

  document.getElementById('modalAltaClave').addEventListener('show.bs.modal', cargarMaquinas);
  document.getElementById('modalAltaClave').addEventListener('hidden.bs.modal', limpiarFormulario);

  setTimeout(() => {
    new bootstrap.Modal(document.getElementById('modalAltaClave')).show();
  }, 300);
</script>
